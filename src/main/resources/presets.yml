# Visual presets.
#
# Particle presets use Spellbook effects. Keep them calm: few points, slow rotation, no bursts.
#   - Plain nodes and edges are static; only teleport, warp and goal markers animate.
#   - Warps use a rotating spiral-helix, inter-graph teleports a rotating helix,
#     local teleports a slowly turning sphere. Prism mirrors the warp spiral.
#   - 'rotation-speed' / 'angular-speed' are radians per effect step (one step = 2 ticks).
#   - 'transforms' (translate, rotate, look-at) are optional and applied in order.
# Block-display presets cannot animate and only use materials, scale and thickness.

ember:
  particle:
    nodes:
      DEFAULT:
        shape:
          type: cube
          size: 0.4
          points-per-edge: 3
        particle:
          type: FLAME
      LOCAL_TELEPORT:
        shape:
          type: sphere
          radius: 0.45
          points: 16
          angular-speed: 0.1
        particle:
          type: SMALL_FLAME
      INTERGRAPH_TELEPORT:
        shape:
          type: helix
          strands: 2
          particles-per-strand: 14
          radius: 0.7
          height: 1.6
          turns: 1.0
          rotation-speed: 0.12
        transforms:
          - type: translate
            x: 0
            y: -0.5
            z: 0
        particle:
          type: SOUL_FIRE_FLAME
      WARP:
        shape:
          type: spiral-helix
          strands: 3
          particles-per-strand: 6
          radius: 0.45
          height: 0.9
          curve: 2.0
          rotation-speed: 0.15
          reverse: false
        transforms:
          - type: translate
            x: 0
            y: -0.45
            z: 0
        particle:
          type: PORTAL
      GUIDED_PATH_GOAL:
        shape:
          type: sphere
          radius: 0.6
          points: 20
          angular-speed: 0.05
        particle:
          type: HAPPY_VILLAGER
    edges:
      DEFAULT_LOCAL:
        shape:
          type: line
          spacing: 0.5
          max-points: 200
        particle:
          type: FLAME
      DIRECTED_LOCAL:
        shape:
          type: moving-point
          speed: 1.0
          spacing: 0.5
          amount-points: 200
          ping-pong: false
        particle:
          type: FLAME
      UNDIRECTED_LOCAL:
        shape:
          type: line
          spacing: 0.5
          max-points: 200
        particle:
          type: FLAME
      BLOCKED:
        shape:
          type: line
          spacing: 0.5
          max-points: 200
        particle:
          type: SMOKE
      INTER_GRAPH:
        shape:
          type: line
          spacing: 0.5
          max-points: 200
        particle:
          type: LAVA
      DIRECTED_INTER_GRAPH:
        shape:
          type: moving-point
          speed: 1.0
          spacing: 0.5
          amount-points: 200
          ping-pong: false
        particle:
          type: LAVA
      UNDIRECTED_INTER_GRAPH:
        shape:
          type: line
          spacing: 0.5
          max-points: 200
        particle:
          type: LAVA
  block-display:
    nodes:
      DEFAULT:
        material: COAL_BLOCK
        scale: 0.45
      LOCAL_TELEPORT:
        material: MAGMA_BLOCK
        scale: 0.55
      INTERGRAPH_TELEPORT:
        material: REDSTONE_BLOCK
        scale: 0.5
      WARP:
        material: OBSIDIAN
        scale: 0.55
      GUIDED_PATH_GOAL:
        material: GOLD_BLOCK
        scale: 0.65
    edges:
      DEFAULT_LOCAL:
        material: ORANGE_WOOL
        thickness: 0.16
        node-clearance: 0.8
      DIRECTED_LOCAL:
        material: GREEN_STAINED_GLASS
        thickness: 0.16
        node-clearance: 0.8
      UNDIRECTED_LOCAL:
        material: LIME_STAINED_GLASS
        thickness: 0.18
        node-clearance: 0.8
      BLOCKED:
        material: RED_WOOL
        thickness: 0.16
        node-clearance: 0.8
      INTER_GRAPH:
        material: GOLD_BLOCK
        thickness: 0.16
        node-clearance: 0.8
      DIRECTED_INTER_GRAPH:
        material: WHITE_STAINED_GLASS
        thickness: 0.16
        node-clearance: 0.8
      UNDIRECTED_INTER_GRAPH:
        material: WHITE_STAINED_GLASS
        thickness: 0.18
        node-clearance: 0.8

